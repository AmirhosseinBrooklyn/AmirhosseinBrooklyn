<svg xmlns="http://www.w3.org/2000/svg" width="450" height="310" viewBox="0 0 450 310" role="img">
  <title>Language footprint</title>
  <desc>Kotlin: 57.7%. JavaScript: 17.1%. CSS: 13.4%. HTML: 7.9%. PHP: 3.9%</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #e6edf3; }
    .muted { fill: #919ba8; }
    .grid { stroke: #30363d; fill: none; }
    .enter { animation: fade .9s ease both; }
    @keyframes fade { from { opacity: .65; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="449" height="309" rx="10" class="grid"/>
  <text x="24" y="32" font-size="15" font-weight="600">Language footprint</text>
  <text x="24" y="53" class="muted" font-size="11">Public original repositories · by code size</text>
  <circle cx="116" cy="158" r="68" fill="none" stroke="#a97bff" stroke-width="23" stroke-dasharray="243.551 427.257" stroke-dashoffset="-0.000" transform="rotate(-90 116 158)" class="enter"/>
  <rect x="223" y="90" width="8" height="8" rx="2" fill="#a97bff"/>
  <text x="241" y="98" font-size="13">Kotlin</text>
  <text x="417" y="98" text-anchor="end" font-size="13" class="muted">57.7%</text>
  <circle cx="116" cy="158" r="68" fill="none" stroke="#f1e05a" stroke-width="23" stroke-dasharray="69.849 427.257" stroke-dashoffset="-246.551" transform="rotate(-90 116 158)" class="enter"/>
  <rect x="223" y="116" width="8" height="8" rx="2" fill="#f1e05a"/>
  <text x="241" y="124" font-size="13">JavaScript</text>
  <text x="417" y="124" text-anchor="end" font-size="13" class="muted">17.1%</text>
  <circle cx="116" cy="158" r="68" fill="none" stroke="#58a6ff" stroke-width="23" stroke-dasharray="54.332 427.257" stroke-dashoffset="-319.400" transform="rotate(-90 116 158)" class="enter"/>
  <rect x="223" y="142" width="8" height="8" rx="2" fill="#58a6ff"/>
  <text x="241" y="150" font-size="13">CSS</text>
  <text x="417" y="150" text-anchor="end" font-size="13" class="muted">13.4%</text>
  <circle cx="116" cy="158" r="68" fill="none" stroke="#f78166" stroke-width="23" stroke-dasharray="30.848 427.257" stroke-dashoffset="-376.732" transform="rotate(-90 116 158)" class="enter"/>
  <rect x="223" y="168" width="8" height="8" rx="2" fill="#f78166"/>
  <text x="241" y="176" font-size="13">HTML</text>
  <text x="417" y="176" text-anchor="end" font-size="13" class="muted">7.9%</text>
  <circle cx="116" cy="158" r="68" fill="none" stroke="#7b83c4" stroke-width="23" stroke-dasharray="13.676 427.257" stroke-dashoffset="-410.580" transform="rotate(-90 116 158)" class="enter"/>
  <rect x="223" y="194" width="8" height="8" rx="2" fill="#7b83c4"/>
  <text x="241" y="202" font-size="13">PHP</text>
  <text x="417" y="202" text-anchor="end" font-size="13" class="muted">3.9%</text>
  <text x="116" y="156" text-anchor="middle" font-size="24" font-weight="600">5</text>
  <text x="116" y="177" text-anchor="middle" class="muted" font-size="11">languages</text>
  <text x="24" y="274" class="muted" font-size="11">Forks excluded. Percentages are based on code size.</text>
  <text x="24" y="291" class="muted" font-size="10">Updated 23 Nov 2026</text>
</svg>
